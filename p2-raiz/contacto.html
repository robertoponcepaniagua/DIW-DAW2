<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · RAÍZ</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="bg-fondo text-texto">
    <!-- ✍️ B3 · Esta página va SOLO con Tailwind (src/tailwind.css), sin SASS. Ponle las clases de utilidad:
         los colores de RAÍZ (del @theme), dos columnas desde md y un botón con hover: y focus-visible:.
         Nada de valores sueltos entre corchetes ni style="". -->
    <header class="bg-marca-oscuro text-white p-4">
      <a href="/" class="text-2xl font-bold">RAÍZ</a>
      <nav aria-label="Principal" class="flex gap-4 mt-2">
        <a href="/">Inicio</a>
        <a href="/producto.html">Monstera</a>
        <a href="/contacto.html" aria-current="page" class="underline">Contacto</a>
      </nav>
    </header>

    <main class="max-w-4xl mx-auto p-6">
      <h1 class="text-3xl font-bold text-marca mb-6">Contacto</h1>

      <div class="grid md:grid-cols-2 gap-6">
        <section aria-label="Dónde estamos" class="bg-marca-suave p-4 rounded-md">
          <h2 class="text-2xl font-bold mb-4">El vivero</h2>
          <p class="leading-relaxed">
            Abrimos de lunes a sábado, de 9:00 a 14:00. Si vienes en persona, te ayudamos a elegir.
          </p>
          <p class="text-tierra font-bold mt-4">Envíos gratis desde 40 €</p>
        </section>

        <form action="#" class="flex flex-col gap-4">
          <label for="nombre" class="flex flex-col gap-1 text-marca-oscuro">
            Nombre
            <input
              id="nombre"
              name="nombre"
              autocomplete="name"
              required
              class="bg-white text-texto border border-marca rounded-md p-2"
            />
          </label>
          <label for="correo" class="flex flex-col gap-1 text-marca-oscuro">
            Correo
            <input
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              required
              class="bg-white text-texto border border-marca rounded-md p-2"
            />
          </label>
          <label for="mensaje" class="flex flex-col gap-1 text-marca-oscuro">
            ¿En qué te ayudamos?
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              required
              class="bg-white text-texto border border-marca rounded-md p-2"
            ></textarea>
          </label>
          <button
            type="submit"
            class="bg-marca text-white p-3 rounded-md font-bold cursor-pointer hover:bg-marca-oscuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-marca"
          >
            Enviar
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-marca-suave p-4">RAÍZ, vivero online · Cádiz</footer>
  </body>
</html>
